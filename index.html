<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Niranga Dharmaratna</title>
  <meta name="description" content="Niranga Dharmaratna, Consultant and Lecturer at NIBM School of Computing and Engineering, Colombo.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fbfaf8;
      --text: #1c1b19;
      --muted: #6b6862;
      --rule: #dcd8d0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151514;
        --text: #eceae5;
        --muted: #9a968e;
        --rule: #33312d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 34rem;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.9rem, 6vw, 2.6rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.15;
    }
    p { margin: 0; }
    .where { color: var(--muted); }
    nav {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.9rem;
    }
    a {
      color: inherit;
      text-underline-offset: 0.2em;
    }
    a:hover { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Niranga Dharmaratna</h1>
    <p>Consultant and Lecturer, NIBM School of Computing and Engineering</p>
    <p class="where">Colombo, Sri Lanka</p>
    <nav>
      <a href="https://github.com/nirangadh">GitHub</a>
    </nav>
  </main>

</body>
</html>
